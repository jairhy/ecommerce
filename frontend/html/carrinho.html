<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho // Night Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/cart.js" defer></script>
    <script src="../js/produtos-ui.js" defer></script>
    <script src="../js/carrinho.js" defer></script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="brand glitch" data-text="NIGHT/MARKET">NIGHT<span class="brand-slash">/</span>MARKET</a>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="./produtos.html">Produtos</a>
                <a href="./carrinho.html" class="active">Carrinho <span class="cart-count" data-cart-count>0</span></a>
                <a href="./login.html" class="nav-guest-only">Login</a>
                <a href="./perfil.html" class="nav-user-only">Perfil</a>
                <a href="./pedidos.html" class="nav-user-only">Meus Pedidos</a>
                <a href="./admin.html" class="nav-admin-only">Painel Admin</a>
                <button class="link-like nav-user-only" data-logout>Sair</button>
            </nav>
        </div>
    </header>

    <main class="container block">
        <div class="block-head">
            <div>
                <p class="eyebrow">:: CARRINHO ::</p>
                <h2>Seus itens</h2>
            </div>
        </div>

        <div id="alerta-area"></div>

        <div class="hero-grid" style="grid-template-columns: 2fr 1fr; align-items:start;">
            <div id="lista-carrinho" class="painel">
                <p class="muted mono">Carregando...</p>
            </div>

            <div class="resumo-carrinho">
                <p class="eyebrow mb-16">RESUMO DO PEDIDO</p>
                <div class="resumo-linha"><span>Itens</span><span id="resumo-itens">0</span></div>
                <div class="resumo-linha total"><span>Total</span><span id="resumo-total">R$ 0,00</span></div>
                <button class="btn btn-primary btn-block mt-16" id="btn-checkout">Finalizar Pedido</button>
                <p class="muted mono mt-8" style="font-size:0.72rem;" id="msg-checkout"></p>
            </div>
        </div>
    </main>

    <footer class="rodape">
        <div class="container">NIGHT MARKET // PEÇAS DE PC — <span>SISTEMA DE E-COMMERCE v1.0</span></div>
    </footer>

</body>
</html>
