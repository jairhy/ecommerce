<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro // Night Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/cart.js" defer></script>
    <script src="../js/validaCpf.js" defer></script>
    <script src="../js/cadastro.js" defer></script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="brand glitch" data-text="NIGHT/MARKET">NIGHT<span class="brand-slash">/</span>MARKET</a>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="./produtos.html">Produtos</a>
                <a href="./carrinho.html">Carrinho <span class="cart-count" data-cart-count>0</span></a>
                <a href="./login.html" class="nav-guest-only">Login</a>
                <a href="./perfil.html" class="nav-user-only">Perfil</a>
                <a href="./pedidos.html" class="nav-user-only">Meus Pedidos</a>
                <a href="./admin.html" class="nav-admin-only">Painel Admin</a>
                <button class="link-like nav-user-only" data-logout>Sair</button>
            </nav>
        </div>
    </header>

    <main class="container block">
        <div class="painel" style="max-width:720px; margin:0 auto;">
            <p class="eyebrow mb-8">:: NOVO IMPLANTE ::</p>
            <h2 class="mb-24">Criar Conta</h2>

            <div id="alerta-area"></div>

            <form id="form-cadastro">
                <div class="linha-2">
                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                </div>

                <div class="linha-2">
                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" required>
                    </div>
                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                        <small class="dica" id="msg-cpf"></small>
                    </div>
                </div>

                <hr style="border-color:var(--c-border); margin:22px 0;">
                <p class="eyebrow mb-16">ENDEREÇO :: AUTOPREENCHIDO VIA CEP</p>

                <div class="linha-2">
                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" placeholder="00000-000" maxlength="9" required>
                        <small class="dica" id="msg-cep"></small>
                    </div>
                    <div class="campo">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" required>
                    </div>
                </div>

                <div class="linha-3">
                    <div class="campo">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" readonly>
                    </div>
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" readonly>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade / UF</label>
                        <input type="text" id="cidade" readonly>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-16" id="btn-cadastrar">Cadastrar</button>
            </form>

            <p class="muted center mt-24">Já tem conta? <a href="./login.html" style="color:var(--c-cyan)">Fazer login</a></p>
        </div>
    </main>

    <footer class="rodape">
        <div class="container">NIGHT MARKET // PEÇAS DE PC — <span>SISTEMA DE E-COMMERCE v1.0</span></div>
    </footer>

</body>
</html>
