<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login // Night Market</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/config.js"></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/cart.js" defer></script>
    <script src="../js/login.js" defer></script>
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <a href="../index.html" class="brand glitch" data-text="NIGHT/MARKET">NIGHT<span class="brand-slash">/</span>MARKET</a>
            <nav class="main-nav">
                <a href="../index.html">Home</a>
                <a href="./produtos.html">Produtos</a>
                <a href="./carrinho.html">Carrinho <span class="cart-count" data-cart-count>0</span></a>
                <a href="./login.html" class="active nav-guest-only">Login</a>
                <a href="./perfil.html" class="nav-user-only">Perfil</a>
                <a href="./pedidos.html" class="nav-user-only">Meus Pedidos</a>
                <a href="./admin.html" class="nav-admin-only">Painel Admin</a>
                <button class="link-like nav-user-only" data-logout>Sair</button>
            </nav>
        </div>
    </header>

    <main class="container block">
        <div class="painel estreito">
            <p class="eyebrow mb-8">:: ACESSO AO SISTEMA ::</p>
            <h2 class="mb-24">Login</h2>

            <div id="alerta-area"></div>

            <form id="form-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="btn-login">Entrar</button>
            </form>

            <p class="muted center mt-24">Ainda não tem conta? <a href="./cadastro.html" style="color:var(--c-cyan)">Cadastre-se</a></p>
        </div>
    </main>

    <footer class="rodape">
        <div class="container">NIGHT MARKET // PEÇAS DE PC — <span>SISTEMA DE E-COMMERCE v1.0</span></div>
    </footer>

</body>
</html>
